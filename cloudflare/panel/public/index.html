<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeraBox Bot Panel</title>
<style>
:root{--bg:#0c0d10;--card:#16181d;--line:#262932;--text:#e8e9ee;--muted:#8c90a0;--accent:#7c5cff;--ok:#2fbf71;--bad:#ef4d4d;--warn:#f0a43a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:18px;margin:0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;margin-top:2px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px system-ui;cursor:pointer}
button.ghost{background:#2a2d36}
button.danger{background:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;background:#0f1115;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px system-ui}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.bar{height:10px;background:#0f1115;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent)}
pre{background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a2d36;padding:10px 16px;border-radius:10px;max-width:90vw;display:none}
.warn{color:var(--warn)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:#2a2d36;border-radius:20px;cursor:pointer;transition:.2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(20px)}
#login{max-width:360px;margin:15vh auto}
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h1 style="margin-bottom:12px">🔐 Bot Panel</h1>
  <form id="lf"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><div style="height:10px"></div><button style="width:100%">Login</button></form>
  <p id="lerr" class="warn"></p>
</div>

<div id="app" class="wrap" hidden>
  <div class="card row">
    <div style="font-size:34px">☁️</div>
    <div class="grow">
      <h1 id="bname">Loading…</h1>
      <div class="muted"><span id="buser"></span> · <span id="bid"></span> · <span id="bstate"></span></div>
    </div>
    <button id="startBtn">▶ Start</button>
    <button id="stopBtn" class="danger">■ Stop</button>
    <button id="logout" class="ghost">Logout</button>
  </div>

  <div class="grid" style="margin-bottom:14px">
    <div class="stat"><span class="muted">Users</span><b id="sUsers">–</b></div>
    <div class="stat"><span class="muted">Premium</span><b id="sPrem">–</b></div>
    <div class="stat"><span class="muted">New users today</span><b id="sNew">–</b></div>
    <div class="stat"><span class="muted">Links today</span><b id="sLinks">–</b></div>
    <div class="stat"><span class="muted">/videos today</span><b id="sVideos">–</b></div>
    <div class="stat"><span class="muted">Paid today</span><b id="sPaid">–</b></div>
  </div>

  <div class="card">
    <h2>Webhook</h2>
    <div id="whInfo" class="muted">–</div>
  </div>

  <div class="two">
    <div class="card">
      <h2>Broadcast</h2>
      <div id="bcState" class="muted" style="margin-bottom:10px">–</div>
      <textarea id="bcText" placeholder="Message to all users (supports **bold**, `code`, [link](https://…))"></textarea>
      <div style="height:10px"></div>
      <div class="row"><button id="bcSend">📢 Send to all users</button><button id="bcStop" class="danger">🛑 Stop</button></div>
    </div>
    <div class="card">
      <h2>Controls</h2>
      <div class="row" style="margin-bottom:14px"><div class="grow">🔧 Maintenance mode<div class="muted">Users get "under maintenance"; admins keep access</div></div><label class="switch"><input type="checkbox" id="maint"><span></span></label></div>
      <h2 style="margin-top:6px">Update bot token</h2>
      <div class="row"><input id="tok" class="grow" placeholder="123456:ABC… from @BotFather"><button id="tokBtn">Update</button></div>
      <div class="muted" id="tokInfo" style="margin-top:6px"></div>
    </div>
  </div>

  <div class="card">
    <h2>TeraBox</h2>
    <div id="tbInfo" class="muted" style="margin-bottom:10px">–</div>
    <div class="row"><select id="tbSlot" style="width:140px"><option value="cookie">Cookie</option><option value="jstoken">jsToken</option></select><input id="tbVal" class="grow" placeholder="Paste the full cookie string or jsToken"><button id="tbBtn">Save</button></div>
  </div>

  <div class="card">
    <h2>Recent errors</h2>
    <pre id="logs">–</pre>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const toast = (t, bad) => { const el = $('toast'); el.textContent = t; el.style.color = bad ? '#ff8a8a' : ''; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 4000); };
async function call(path, body) {
  const r = await fetch('/api/' + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ ok: false, error: 'Bad response (' + r.status + ')' }));
  if (r.status === 401 && j.error === 'login') { show(false); throw new Error('login'); }
  return j;
}
function show(loggedIn) { $('login').hidden = loggedIn; $('app').hidden = !loggedIn; }
const fmtTime = s => s ? new Date(s * 1000).toLocaleString() : '';
const esc = t => String(t ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

let timer;
async function refresh() {
  let s;
  try { s = await call('status'); } catch { return; }
  if (!s.ok) return toast(s.error || 'Status failed', true);
  show(true);
  $('bname').textContent = s.bot ? s.bot.name : 'Token not working';
  $('buser').textContent = s.bot ? '@' + s.bot.username : (s.tokenError || '');
  $('bid').textContent = s.bot ? s.bot.id : '';
  $('bstate').innerHTML = s.running ? '<span class="dot" style="background:var(--ok)"></span>Running' : '<span class="dot" style="background:var(--bad)"></span>Stopped';
  $('startBtn').disabled = s.running; $('stopBtn').disabled = !s.running;
  const t = s.stats.today || {};
  $('sUsers').textContent = s.stats.users.toLocaleString(); $('sPrem').textContent = s.stats.premium;
  $('sNew').textContent = t.new_users || 0; $('sLinks').textContent = t.links || 0; $('sVideos').textContent = t.videos || 0; $('sPaid').textContent = (t.paid || 0) + (t.revenue ? ' · ₹' + t.revenue : '');
  const w = s.webhook;
  $('whInfo').innerHTML = (w.url ? (w.ours ? '✅ Points to this Cloudflare bot' : '<span class="warn">⚠️ Points somewhere else (e.g. Telebot Creator) — press Start to take it back</span>') + '<br><span class="muted">' + esc(w.url) + '</span>' : '<span class="warn">No webhook — the bot is stopped.</span>')
    + '<br>Pending updates: ' + w.pending + (w.lastError ? '<br><span class="warn">Last Telegram error: ' + esc(w.lastError) + ' (' + fmtTime(w.lastErrorAt) + ')</span>' : '');
  $('maint').checked = s.maintenance;
  $('tokInfo').textContent = 'Token in use: ' + (s.tokenSource === 'panel' ? 'set from this panel' : 'the BOT_TOKEN secret');
  $('tbInfo').textContent = 'Cookie: ' + (s.terabox.cookie ? 'set (' + s.terabox.cookieFrom + ')' : 'NOT SET') + ' · jsToken: ' + (s.terabox.jstoken ? s.terabox.jstoken + '…' : 'not set');
  const b = s.broadcast;
  if (b) {
    const doneN = b.sent + b.failed, pct = Math.min(100, Math.floor(doneN / Math.max(b.total, 1) * 100));
    $('bcState').innerHTML = (b.done ? 'Last broadcast #' + b.id + ' — finished/stopped' : '<b>Broadcast #' + b.id + ' running</b>') +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>✅ ' + b.sent + ' sent · ❌ ' + b.failed + ' failed · ' + doneN + ' / ' + b.total + ' (' + pct + '%)';
    $('bcStop').disabled = b.done; $('bcSend').disabled = !b.done;
  } else { $('bcState').textContent = 'No broadcasts yet.'; $('bcStop').disabled = true; $('bcSend').disabled = false; }
  $('logs').textContent = s.logs.length ? s.logs.join('\n') : 'No errors 🎉';
  clearTimeout(timer); timer = setTimeout(refresh, b && !b.done ? 5000 : 30000);
}
async function act(path, body, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try { const r = await call(path, body); toast(r.ok ? r.message : r.error, !r.ok); } catch {}
  refresh();
}
$('lf').onsubmit = async e => {
  e.preventDefault(); $('lerr').textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) }).then(r => r.json()).catch(() => ({}));
  if (r.ok) { $('pw').value = ''; refresh(); } else $('lerr').textContent = r.error || 'Login failed';
};
$('logout').onclick = async () => { await fetch('/api/logout'); show(false); };
$('startBtn').onclick = () => act('start', {});
$('stopBtn').onclick = () => act('stop', {}, 'Stop the bot? Users will get no replies until you press Start.');
$('maint').onchange = e => act('maintenance', { on: e.target.checked });
$('tokBtn').onclick = () => { const t = $('tok').value.trim(); if (t) act('token', { token: t }, 'Switch the bot to this token? If it is a different bot, the old one stops and saved video file_ids are cleared.').then(() => $('tok').value = ''); };
$('bcSend').onclick = () => { const t = $('bcText').value.trim(); if (t) act('broadcast', { text: t }, 'Send this message to ALL users?').then(() => $('bcText').value = ''); };
$('bcStop').onclick = () => act('stopbroadcast', {}, 'Stop the running broadcast?');
$('tbBtn').onclick = () => { const v = $('tbVal').value.trim(); if (v) act('terabox', { slot: $('tbSlot').value, value: v }).then(() => $('tbVal').value = ''); };
refresh();
</script>
</body>
</html>
