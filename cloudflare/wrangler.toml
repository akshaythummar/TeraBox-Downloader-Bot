name = "terabox-stream-bot"
main = "src/index.js"
compatibility_date = "2026-06-01"
# lets this worker fetch the resolver/proxy workers even if they live on the same account
compatibility_flags = ["global_fetch_strictly_public"]

# Same values as config.py on the amazon-ktworker branch
[vars]
RESOLVER = "https://old.wawof50236.workers.dev"        # TERABOX_RESOLVER_WORKER
HLS_PROXY = "https://amzon.ktnetwork002.workers.dev"   # TERABOX_HLS_PROXY_WORKER
OWNER_ID = "618879443"
ADMINS = "618879443"              # comma-separated
FORCE_CHANNELS = "@AT_BOTZ"       # comma-separated; bot must be admin there
FORCE_GROUPS = ""
SPOILER_VIDEOS = "true"
TZ = "Asia/Kolkata"               # dates in messages (Python used the server's local time)
VIDEOS_FREE_MODE = "false"
VIDEOS_PAYMENT_API = "https://terabox-payment-d1.akshaythummar.workers.dev"
VIDEOS_POOL_WORKER = "https://videosave.hoyakey802.workers.dev"
VIDEOS_TRIAL_SECONDS = "180"
VIDEOS_COOLDOWN_SECONDS = "1"
VIDEOS_PROMO_URL = "https://mangoflix.xyz"
VIDEOS_CHANNEL = "-1002386227767"     # old storage channel; the cron pre-uploads /videos here (bot must be admin)

[[d1_databases]]
binding = "DB"
database_name = "terabox-bot-eu"
database_id = "59f6c78a-5f4c-433f-a793-5d8fc62db3d0"   # Western Europe, next to Telegram's servers (old APAC db: terabox-bot)

[version_metadata]
binding = "CF_VERSION"               # shown as "Build" on /restart

[triggers]
crons = ["* * * * *"]                # broadcasts every minute; reminders + cleanup hourly
